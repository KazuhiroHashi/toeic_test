# iOS のビルドと App Store Connect へのアップロードを、GitHub の macOS ランナーで行う。
# Mac を持っていなくても、このワークフローを手動実行するだけで TestFlight まで届く。
#
# 必要な Secrets(リポジトリの Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     … App Store Connect API キーの Key ID
#   ASC_ISSUER_ID  … 同 Issuer ID
#   ASC_KEY_P8     … .p8 ファイルの中身(テキストをそのまま貼る)
#
# 署名は Xcode のクラウド管理(自動署名)に任せる。API キー経由で
# 証明書とプロビジョニングプロファイルが自動生成されるので、
# Mac の Keychain も手動の証明書作成も要らない。
#
# ビルド番号は GitHub の実行番号をそのまま使う(実行のたびに増えるので衝突しない)。

name: iOS build & upload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: W2TSCP2QY2
      MARKETING_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8 の CLI は Node 22 以上を要求する(20 だと即死する)
          node-version: 22

      - name: 依存関係を入れる
        run: npm install

      - name: Webアセットを組む(www/)
        run: bash tools/build_app.sh

      - name: iOS プロジェクトを生成する
        run: |
          npx cap add ios
          node tools/setup_ios.js
          npx cap sync ios

      - name: アプリアイコンを差し替える
        # Capacitor の雛形にはプレースホルダのアイコンが入っている。
        # そのまま出すと審査で確実に指摘されるので、必ず実物に置き換える。
        run: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -f assets/appicon/icon-1024.png || { echo "NG: アイコンの原本がありません"; exit 1; }
          test -d "$ICON_DIR" || { echo "NG: AppIcon.appiconset が見つかりません"; ls -R ios/App/App/Assets.xcassets; exit 1; }
          # 雛形の PNG をすべて実物で上書きする(ファイル名は雛形の世代で変わるため列挙しない)
          find "$ICON_DIR" -name "*.png" -exec cp assets/appicon/icon-1024.png {} \;
          echo "差し替えたファイル:"; ls "$ICON_DIR"

      - name: API キーを配置する
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: アーカイブする
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: App Store Connect にアップロードする
        # destination=upload にすると、書き出しと同時に App Store Connect へ送られる。
        # 別途 altool や Transporter を叩く必要はない。
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>W2TSCP2QY2</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: 後始末(キーを消す)
        if: always()
        run: rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
