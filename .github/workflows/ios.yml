# iOS のビルドと App Store Connect へのアップロードを、GitHub の macOS ランナーで行う。
# Mac を持っていなくても、このワークフローを手動実行するだけで TestFlight まで届く。
#
# 必要な Secrets(リポジトリの Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     … App Store Connect API キーの Key ID
#   ASC_ISSUER_ID  … 同 Issuer ID
#   ASC_KEY_P8     … .p8 ファイルの中身(テキストをそのまま貼る)
#
# 署名は fastlane(fastlane/Fastfile)が行う。自動署名は開発用プロファイルを
# 作ろうとしてテスト端末の登録を要求するため、端末ゼロの CI では通らない。
# 配布用証明書を API キーで作り、手動署名でアーカイブする方式にしている。
#
# ビルド番号は GitHub の実行番号をそのまま使う(実行のたびに増えるので衝突しない)。

name: iOS build & upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: "公開するバージョン番号(App Store で審査済みの番号より必ず大きくする)"
        required: true
        default: "1.0.1"

jobs:
  build:
    # Apple は 2026 年から iOS 26 SDK(Xcode 26)でのビルドしか受け付けない。
    # macos-15 の既定 Xcode は 16.4 で古く、アップロードで 409 になるため
    # macos-26 ランナーを使う。
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: W2TSCP2QY2
      MARKETING_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8 の CLI は Node 22 以上を要求する(20 だと即死する)
          node-version: 22

      - name: 依存関係を入れる
        run: npm install

      - name: Webアセットを組む(www/)
        run: bash tools/build_app.sh

      - name: iOS プロジェクトを生成する
        run: |
          npx cap add ios
          node tools/setup_ios.js
          npx cap sync ios

      - name: アプリアイコンを差し替える
        # Capacitor の雛形にはプレースホルダのアイコンが入っている。
        # そのまま出すと審査で確実に指摘されるので、必ず実物に置き換える。
        run: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -f assets/appicon/icon-1024.png || { echo "NG: アイコンの原本がありません"; exit 1; }
          test -d "$ICON_DIR" || { echo "NG: AppIcon.appiconset が見つかりません"; ls -R ios/App/App/Assets.xcassets; exit 1; }
          # 雛形の PNG をすべて実物で上書きする(ファイル名は雛形の世代で変わるため列挙しない)
          find "$ICON_DIR" -name "*.png" -exec cp assets/appicon/icon-1024.png {} \;
          echo "差し替えたファイル:"; ls "$ICON_DIR"

      - name: Xcode を選ぶ
        # ランナーには複数の Xcode が入っている。iOS 26 SDK を持つ最新版を明示的に選ぶ
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "使用する Xcode: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: 保存済みの配布用証明書を取り出す
        # ランナーは毎回まっさらで、証明書の秘密鍵は実行が終わると消える。
        # 消えたまま毎回作り直すと Apple の証明書上限(数枚)にすぐ当たるので、
        # 初回に作った証明書を p12 で書き出してキャッシュに保存し、使い回す。
        uses: actions/cache/restore@v4
        with:
          path: certs
          key: dist-cert-v1

      - name: ビルドして TestFlight に上げる
        # 署名まわりは fastlane に任せる(fastlane/Fastfile を参照)。
        # 端末登録なしで通すため、配布用証明書での手動署名を使う。
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          # p12 の暗号化パスワード。専用の Secret を増やさずに済むよう、
          # 既にある2つの Secret をつないだ文字列を使う(ログには出さない)
          P12_PASSWORD: ${{ secrets.ASC_KEY_ID }}-${{ secrets.ASC_ISSUER_ID }}
          MARKETING_VERSION: ${{ inputs.version }}
        run: fastlane ios release

      - name: 配布用証明書を保存する(初回のみ実際に保存される)
        # 同じキーのキャッシュが既にあれば何もしない(上書き不可のため)。
        # ビルドが失敗しても、証明書さえ作れていれば保存したいので always にする。
        if: always()
        uses: actions/cache/save@v4
        with:
          path: certs
          key: dist-cert-v1

